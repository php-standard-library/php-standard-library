name: "documentation deploy"

on:
  push:
    branches:
      - "next"
    tags:
      - "*"

permissions:
  contents: "write"

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: "build and deploy"
    runs-on: "ubuntu-latest"
    steps:
      - name: "checkout"
        uses: "actions/checkout@v6"

      - name: "installing PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "8.5"
          ini-values: memory_limit=-1
          tools: composer:v2
          extensions: bcmath, mbstring, intl, sodium, json, brotli

      - uses: extractions/setup-just@v4

      - name: "installing dependencies"
        run: just install

      - name: "determine version"
        id: "version"
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=next" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "generating documentation"
        run: just docs
        env:
          GITHUB_REF_NAME: "${{ steps.version.outputs.version }}"

      - name: "checkout gh-pages"
        uses: "actions/checkout@v6"
        with:
          ref: "gh-pages"
          path: "gh-pages"
        continue-on-error: true

      - name: "initialize gh-pages if needed"
        run: |
          if [ ! -d "gh-pages/.git" ]; then
            mkdir -p gh-pages
            cd gh-pages
            git init -b gh-pages
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

      - name: "deploy versioned docs"
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IS_TAG="${{ steps.version.outputs.is_tag }}"

          # Replace the version directory with the freshly generated static tree
          # (front page, one dir per component, per-version assets and sitemap).
          rm -rf "gh-pages/${VERSION}"
          mkdir -p "gh-pages/${VERSION}"
          cp -r docs/dist/. "gh-pages/${VERSION}/"

          # Update versions.json
          cd gh-pages
          if [ -f versions.json ]; then
            MANIFEST=$(cat versions.json)
          else
            MANIFEST='{"latest":null,"versions":[]}'
          fi

          MANIFEST=$(echo "$MANIFEST" | php -r '
            $m = json_decode(file_get_contents("php://stdin"), true);
            $version = getenv("VERSION");
            $isTag = getenv("IS_TAG") === "true";
            if (!in_array($version, $m["versions"], true)) {
              $m["versions"][] = $version;
            }
            if ($isTag) {
              $m["latest"] = $version;
            }
            // Sort: "next" first, then tags in reverse order
            usort($m["versions"], function($a, $b) {
              if ($a === "next") return -1;
              if ($b === "next") return 1;
              return version_compare($b, $a);
            });
            // Refresh this version'\''s component slugs (cwd is gh-pages; the version dir was just copied),
            // so the switcher only deep-links where a target version actually has the component.
            $components = $m["components"] ?? [];
            $slugs = [];
            if (is_dir($version)) {
              foreach (scandir($version) as $e) {
                if ($e === "." || $e === ".." || $e === "assets") continue;
                if (is_dir("$version/$e") && is_file("$version/$e/index.html")) $slugs[] = $e;
              }
            }
            sort($slugs);
            $components[$version] = $slugs;
            $m["components"] = $components;
            echo json_encode($m, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES);
          ')
          echo "$MANIFEST" > versions.json

          # Generate root index.html redirect
          LATEST=$(echo "$MANIFEST" | php -r '
            $m = json_decode(file_get_contents("php://stdin"), true);
            echo $m["latest"] ?? "next";
          ')
          cat > index.html <<REDIRECT
          <!DOCTYPE html>
          <html>
          <head><meta http-equiv="refresh" content="0;url=/${LATEST}/"></head>
          <body>Redirecting to <a href="/${LATEST}/">/${LATEST}/</a></body>
          </html>
          REDIRECT

          # robots.txt (only honored at the domain root) pointing at the root sitemap.
          cat > robots.txt <<ROBOTS
          User-agent: *
          Allow: /
          Sitemap: https://php-standard-library.dev/sitemap.xml
          ROBOTS

          # Root sitemap index referencing the latest version's per-version sitemap.
          BUILD_DATE=$(date -u +%Y-%m-%d)
          cat > sitemap.xml <<SITEMAP
          <?xml version="1.0" encoding="UTF-8"?>
          <sitemapindex xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <sitemap><loc>https://php-standard-library.dev/${LATEST}/sitemap.xml</loc><lastmod>${BUILD_DATE}</lastmod></sitemap>
          </sitemapindex>
          SITEMAP

          # Expose the latest version's llms.txt / llms-full.txt at the domain root,
          # which is where coding agents look. They use absolute URLs, so the copy stays valid.
          if [ -f "${LATEST}/llms.txt" ]; then cp "${LATEST}/llms.txt" llms.txt; fi
          if [ -f "${LATEST}/llms-full.txt" ]; then cp "${LATEST}/llms-full.txt" llms-full.txt; fi

          # Custom domain for GitHub Pages (kept in sync in case gh-pages was ever
          # rebuilt from scratch and lost the CNAME).
          echo "php-standard-library.dev" > CNAME

          # Ensure Jekyll is disabled
          touch .nojekyll
        env:
          VERSION: "${{ steps.version.outputs.version }}"
          IS_TAG: "${{ steps.version.outputs.is_tag }}"

      - name: "commit and push gh-pages"
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "deploy: ${{ steps.version.outputs.version }}"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" 2>/dev/null \
            || git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push origin HEAD:gh-pages --force

name: split check

on:
  pull_request:

jobs:
  check:
    name: check dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, mbstring, intl, sodium, json, brotli
          coverage: none

      - uses: extractions/setup-just@v4

      - run: just install
      - run: just split-install
      - run: just split-check

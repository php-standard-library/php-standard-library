name: split sync

on:
  push:
    branches:
      - next
      - '*.*.x'

jobs:
  sync:
    name: sync split repositories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.SPLIT_APP_ID }}
          private-key: ${{ secrets.SPLIT_APP_PRIVATE_KEY }}
          owner: php-standard-library

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, mbstring, intl, sodium, json, brotli
          coverage: none

      - uses: extractions/setup-just@v4

      - name: configure git
        run: |
          git config --global user.name "psl-splitter[bot]"
          git config --global user.email "psl-splitter[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - run: just install
      - run: just split-install
      - run: just split ${{ github.ref_name }}

name: "unit tests"

on:
  pull_request: ~
  push: ~

jobs:
  unit-tests:
    name: "unit tests"

    runs-on: ${{ matrix.operating-system }}

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.4"
          - "8.5"
          - "8.6"
        operating-system:
          - "macos-latest"
          - "ubuntu-latest"
          - "windows-latest"
        exclude:
          - php-version: "8.4"
            operating-system: "windows-latest"

    steps:
      - name: "checkout"
        uses: "actions/checkout@v6"

      - name: "start httpbun"
        if: matrix.operating-system == 'ubuntu-latest'
        run: |
          docker run -d -p 3090:80 sharat87/httpbun --endpoint-bytes-size-limit 100000000
          timeout 30 bash -c 'until curl -sf http://localhost:3090/get > /dev/null; do sleep 1; done'

      - name: "start microsocks"
        if: matrix.operating-system == 'ubuntu-latest'
        run: |
          docker run -d --network host vimagick/microsocks
          timeout 10 bash -c 'until nc -z 127.0.0.1 1080; do sleep 1; done'

      - name: "start tinyproxy"
        if: matrix.operating-system == 'ubuntu-latest'
        run: |
          printf 'Port 8888\nListen 0.0.0.0\nTimeout 600\nAllow 0.0.0.0/0\n' > /tmp/tinyproxy.conf
          docker run -d --network host -v /tmp/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf vimagick/tinyproxy
          timeout 10 bash -c 'until nc -z 127.0.0.1 8888; do sleep 1; done'

      # Ubuntu 26.04 ships the legacy zone names (US/Eastern, EST, Asia/Calcutta, ...) in a separate package, and the
      # PHP build there reads the system zone database, so the DateTime alias tests need it installed.
      - name: "installing legacy timezone names"
        if: matrix.operating-system == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y tzdata-legacy

      - name: "installing PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "${{ matrix.php-version }}"
          ini-values: memory_limit=-1
          tools: composer:v2, cs2pr
          # The Windows Brotli DLLs from PECL are built against the newest PHP patch release and may not load into the
          # PHP preinstalled on the runner image, so Brotli is only installed off Windows; its tests skip without it.
          extensions: bcmath, mbstring, intl, sodium, json${{ matrix.operating-system != 'windows-latest' && ', brotli' || '' }}

      # PHP 8.4 and 8.5 set no TLS session ID context on servers, and OpenSSL 4.1 issues no session tickets without one
      # (openssl/openssl#31964). Homebrew builds PHP against OpenSSL 4.0 but links the newest 4.x keg, so point it back
      # at 4.0 until PHP sets a session ID context itself. PHP 8.6 sets one through the session_id_context option.
      - name: "pinning OpenSSL 4.0 on macOS"
        if: matrix.operating-system == 'macos-latest' && matrix.php-version != '8.6'
        run: |
          keg=$(ls -d "$(brew --cellar openssl@4)"/4.0.* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$keg" ]; then echo "::error::No OpenSSL 4.0 keg on this runner"; exit 1; fi
          ln -sfn "$keg" "$(brew --prefix)/opt/openssl@4"
          php --ri openssl | grep "Library Version"

      - name: "diagnose openssl (temporary)"
        if: matrix.operating-system == 'macos-latest'
        run: |
          php -r 'echo PHP_VERSION, " ", OPENSSL_VERSION_TEXT, PHP_EOL;'
          php --ri openssl
          brew list --versions | grep -i -E 'openssl|php' || true
          otool -L "$(php -r 'echo PHP_BINARY;')" | grep -i -E 'ssl|crypto' || true
          php -r '$e = ini_get("extension_dir"); foreach (glob($e . "/openssl*.so") ?: [] as $f) { echo $f, PHP_EOL; }'
          bash .github/tls-ticket-probe.sh

      - name: "caching dependencies"
        uses: "actions/cache@v5"
        with:
          path: |
            ~/.composer/cache
            vendor
          key: "php-${{ matrix.php-version }}"
          restore-keys: "php-${{ matrix.php-version }}"

      - uses: extractions/setup-just@v3

      - name: "installing dependencies"
        run: just install
        env:
          COMPOSER_IGNORE_PLATFORM_REQ: ${{ matrix.operating-system == 'windows-latest' && 'ext-brotli' || '' }}

      - name: "running unit tests"
        run: just test
        env:
          HTTPBUN_URL: ${{ matrix.operating-system == 'ubuntu-latest' && 'http://localhost:3090' || '' }}
          SOCKS_PROXY_HOST: ${{ matrix.operating-system == 'ubuntu-latest' && '127.0.0.1' || '' }}
          SOCKS_PROXY_PORT: ${{ matrix.operating-system == 'ubuntu-latest' && '1080' || '' }}
          HTTP_TUNNEL_URL: ${{ matrix.operating-system == 'ubuntu-latest' && 'http://127.0.0.1:8888' || '' }}

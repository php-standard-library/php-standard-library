name: "unit tests"

on:
  pull_request: ~
  push: ~

jobs:
  unit-tests:
    name: "unit tests"

    runs-on: ${{ matrix.operating-system }}

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.4"
          - "8.5"
          - "8.6"
        operating-system:
          - "macos-latest"
          - "ubuntu-latest"
          - "windows-latest"
        exclude:
          - php-version: "8.4"
            operating-system: "windows-latest"

    steps:
      - name: "checkout"
        uses: "actions/checkout@v7"

      - name: "start httpbun"
        if: matrix.operating-system == 'ubuntu-latest'
        run: |
          docker run -d -p 3090:80 sharat87/httpbun --endpoint-bytes-size-limit 100000000
          timeout 30 bash -c 'until curl -sf http://localhost:3090/get > /dev/null; do sleep 1; done'

      - name: "start microsocks"
        if: matrix.operating-system == 'ubuntu-latest'
        run: |
          docker run -d --network host vimagick/microsocks
          timeout 10 bash -c 'until nc -z 127.0.0.1 1080; do sleep 1; done'

      - name: "start tinyproxy"
        if: matrix.operating-system == 'ubuntu-latest'
        run: |
          printf 'Port 8888\nListen 0.0.0.0\nTimeout 600\nAllow 0.0.0.0/0\n' > /tmp/tinyproxy.conf
          docker run -d --network host -v /tmp/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf vimagick/tinyproxy
          timeout 10 bash -c 'until nc -z 127.0.0.1 8888; do sleep 1; done'

      - name: "installing PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "${{ matrix.php-version }}"
          ini-values: memory_limit=-1
          tools: composer:v2, cs2pr
          extensions: bcmath, mbstring, intl, sodium, json, brotli

      - name: "caching dependencies"
        uses: "actions/cache@v5"
        with:
          path: |
            ~/.composer/cache
            vendor
          key: "php-${{ matrix.php-version }}"
          restore-keys: "php-${{ matrix.php-version }}"

      - uses: extractions/setup-just@v3

      - name: "installing dependencies"
        run: just install
        env:
          # No Brotli DLL is available for PHP 8.6 on Windows; its tests skip when the extension is missing.
          COMPOSER_IGNORE_PLATFORM_REQ: ${{ matrix.php-version == '8.6' && matrix.operating-system == 'windows-latest' && 'ext-brotli' || '' }}

      - name: "running unit tests"
        run: just test
        env:
          HTTPBUN_URL: ${{ matrix.operating-system == 'ubuntu-latest' && 'http://localhost:3090' || '' }}
          SOCKS_PROXY_HOST: ${{ matrix.operating-system == 'ubuntu-latest' && '127.0.0.1' || '' }}
          SOCKS_PROXY_PORT: ${{ matrix.operating-system == 'ubuntu-latest' && '1080' || '' }}
          HTTP_TUNNEL_URL: ${{ matrix.operating-system == 'ubuntu-latest' && 'http://127.0.0.1:8888' || '' }}
